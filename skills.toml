# Tiga-Skills 清单：唯一的权威来源，修改后运行 install 与 check。
#
# 每个 [skills.<name>] 对应 skills/<name>/：
#   zh        README skill 列表中的中文描述
#   targets   "user" 链接到 ~/.claude/skills 与 ~/.agents/skills；
#             "project:<路径>" 链接到该项目的 .agents/skills（路径可用 ~）
#   upstream  外部 skill 的来源仓库与目录；锁定的 commit 记录在 skills.lock.json
#   requires  运行时调用的其他 skill；check 校验它们已登记，且装在用户级或相同项目

[skills.tiga-skills]
zh = "管理本仓库：按清单安装用户级与项目级 skill，增删 skill，审查并采纳外部 skill 的上游更新，从关注列表发现新 skill。"
targets = ["user"]

[skills.grill-with-docs]
zh = "以追问方式打磨计划或设计，同时沉淀 ADR 与术语表；依赖 grilling 与 domain-modeling。"
targets = ["user"]
upstream = { repo = "https://github.com/mattpocock/skills.git", path = "skills/engineering/grill-with-docs" }
requires = ["grilling", "domain-modeling"]

[skills.grilling]
zh = "以设计树方式分轮追问计划、决策或想法，直到达成共同理解；grill-with-docs 的依赖。"
targets = ["user"]
upstream = { repo = "https://github.com/mattpocock/skills.git", path = "skills/productivity/grilling" }

[skills.domain-modeling]
zh = "构建并打磨项目的领域模型，维护 GLOSSARY.md 与 ADR；grill-with-docs 的依赖。"
targets = ["user"]
upstream = { repo = "https://github.com/mattpocock/skills.git", path = "skills/engineering/domain-modeling" }

[skills.writing-for-agents]
zh = "编写供 Agent 读取的文档（skill、AGENTS.md、CLAUDE.md）的参考：上下文指针、信息层级、完成标准与精简；retro 的依赖。"
targets = ["user"]
upstream = { repo = "https://github.com/mattpocock/skills.git", path = "skills/productivity/writing-for-agents" }

[skills.handoff]
zh = "把当前会话压缩成交接文档，存到系统临时目录，供新会话或其他 agent 接手；仅手动调用。"
targets = ["user"]
upstream = { repo = "https://github.com/mattpocock/skills.git", path = "skills/productivity/handoff" }

[skills.retro]
zh = "复盘一次编码会话，从导航、自动检查、AGENTS.md 精简、工具开销等方面提出环境改进建议；依赖 writing-for-agents，仅手动调用。"
targets = ["user"]
upstream = { repo = "https://github.com/mattpocock/skills.git", path = "skills/engineering/retro" }
requires = ["writing-for-agents"]

[skills.ponytail-audit]
zh = "对整个仓库做一次性质量审查：bug、安全、负载、测试缺口、速度与可删减代码，按优先级排序，只出报告不改代码。"
targets = ["user"]
upstream = { repo = "https://github.com/DietrichGebert/ponytail.git", path = "skills/ponytail-audit" }

# 候选上游仓库：只用于按需发现新 skill，不克隆、不同步。
[watch]
repos = [
  "https://github.com/affaan-m/ECC",
  "https://github.com/anthropics/skills",
  "https://github.com/DietrichGebert/ponytail",
  "https://github.com/Imbad0202/academic-research-skills",
  "https://github.com/mattpocock/skills",
]
