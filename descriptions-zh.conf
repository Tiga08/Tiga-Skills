# README 技能清单的权威元数据源，固定放在项目根目录。
# 每个 skill 必须提供 <name>.description。
# description 概述核心功能与适用场景，不再逐项枚举参数；参数优先取 SKILL.md 的 argument-hint。
# <name>.arguments 仅在 SKILL.md 缺少 argument-hint 时作为 README 参数列的兜底（外部技能）。
# skill 核心功能或调用方式变化时，必须同步更新对应字段。

tiga-global-skills.description=管理 Tiga-Skills 全局技能注册表：配置用户级链接、注册与移除外部或自定义 skill、列出条目、检查链接与 frontmatter 健康状态、刷新 README 技能清单；中文说明来自根目录 descriptions-zh.conf。

tiga-commit-push-pr.description=安全分析并执行 Git 分支切换、Conventional Commit、推送与 PR 工作流，适用于提交当前改动、直接推送当前分支或创建和更新 PR。
tiga-govsync.description=依据仓库实况和单一权威来源模型治理项目自有 README、docs 与 Agent 指令文件，同步简体中文译文，并可审计本地 Skill。适用于治理文档缺失、陈旧、重复、章节结构不一致或与仓库状态脱节的情况。
tiga-local-skills.description=管理当前项目 `.agents/skills/` 中供 Claude Code 与 Codex 共享的项目级 skills，支持初始化、导入、更新、移除与列出；增删 AG-Tools 来源条目时同步维护其 SKILLS-REFS.md 下游引用清单。
tiga-translate.description=翻译 Markdown 文件或目录前先判断需要翻译的内容与数量，再按文档类型自动放置简体中文译文；可手动调用，也可由 `tiga-govsync` 等其他技能调用。
tiga-update-skills.description=依据 Claude Code、Codex 与 Agent Skills 官方规范审查并更新本地 Skill，检查结构、兼容性、元数据、调用策略与规范漂移，并可刷新官方文档快照后自审自身。

grilling.description=以设计树方式分轮追问计划、决策或想法：每轮把当前可判定的问题一次性列出并附推荐答案，事实由子代理自行查证，直到所有分支澄清并达成共同理解。

baoyu-format-markdown.description=将纯文本或 Markdown 优化为带 frontmatter、标题、摘要、层级、列表和代码块的 `{filename}-formatted.md`，也可选择保留原结构或仅原地修正排版。
baoyu-format-markdown.arguments=<file> [--quotes|-q] [--no-quotes] [--spacing|-s] [--no-spacing] [--emphasis|-e] [--no-emphasis]
baoyu-url-to-markdown.description=通过 Chrome 抓取网页并用 X、YouTube、Hacker News 或通用适配器转换为 Markdown/JSON，可按需等待登录或人工交互后再抓取。
baoyu-url-to-markdown.arguments=<url> [--output <path>] [--format markdown|json] [--adapter x|youtube|hn|generic] [--headless] [--wait-for none|interaction|force] ...

skill-scout.description=在创建、复刻或扩展 skill 前搜索并审查本地、marketplace、GitHub 和 Web 候选；无固定命令参数，调用时提供目标任务、触发条件、涉及领域与关键词。
skill-scout.arguments=
skill-stocktake.description=按统一质量清单审查全局及当前项目的 Claude skills 和 commands，依据缓存自动执行增量 Quick Scan 或完整盘点，当前工作目录决定项目级扫描范围。
skill-stocktake.arguments=[full]
